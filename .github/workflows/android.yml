name: Android private test build
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build private test APK
        run: npm run android:build
      - name: Android lint
        run: npm run android:lint
      - name: Build unsigned release bundle
        run: npm run android:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: wealthpilot-test-apk
          path: artifacts/wealthpilot-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: wealthpilot-unsigned-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
